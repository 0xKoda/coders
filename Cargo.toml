[package]
name = "code-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28", features = ["full"] }
# TUI dependencies
ratatui = "0.26.0"
crossterm = "0.27"
# Config management
config = "0.13"
# For static initialization
once_cell = "1.18"
# For logging
log = "0.4"
# For date/time handling
chrono = "0.4"
log4rs = "1.3.0"
